[package]
name = "anirena"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-matcher", "fuzzy-select"] }
home = "0.5.12"
qbit-rs = { version = "0.6.0", features = ["builder", "reqwest", "rustls-tls"], default-features = false }
reqwest = { version = "0.13.4", features = ["json", "query", "gzip", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "net",
    "fs",
    "macros",
    "rt-multi-thread",
] }
uuid = { version = "1.24.0", features = ["serde"] }
